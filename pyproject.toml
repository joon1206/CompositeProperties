[project]
name = "composite-research"
version = "0.1.0"
description = "Reproducible audit of hierarchical composite thermoelastic predictions"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
jax = ["jax>=0.6"]

[project.scripts]
composite-experiments = "composite_research.experiments:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
